<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>배경만 그리기</title>
  <style>
    html, body { margin: 0; height: 100%; }
    canvas, .grain { position: fixed; inset: 0; width: 100%; height: 100%; }
    .grain { mix-blend-mode: overlay; }
  </style>
</head>
<body>
  <!-- 바로가기 같은 화면 요소 없이 배경만 실제 크기로 그린다. gradient-check.mjs가 대비를 재는 데 쓴다.
       ?accent=rrggbb&mode=dark|light&comp=aurora|horizon|bloom|currents&seed=n&t=초 -->
  <canvas id="c"></canvas>
  <div class="grain" id="g"></div>
  <script type="module">
    import { buildScene, AuroraGL, grainCss } from '/dist/js/aurora.js';
    const q = new URLSearchParams(location.search);
    const mode = q.get('mode') ?? 'dark';
    const sc = buildScene({
      accent: '#' + (q.get('accent') ?? '4087de'), mode, seed: +(q.get('seed') ?? 1),
      composition: q.get('comp') ?? 'aurora', aspect: innerWidth / innerHeight,
    });
    AuroraGL.create(document.getElementById('c')).draw(sc, +(q.get('t') ?? 0), Math.round(innerWidth / 2), Math.round(innerHeight / 2));
    document.getElementById('g').style.backgroundImage = grainCss(mode);
    document.title = 'ready';
  </script>
</body>
</html>
