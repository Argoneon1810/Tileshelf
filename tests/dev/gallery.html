<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>배경 고르기 갤러리</title>
<style>
  :root { --text-dark: #ebeff4; --text-light: #1d2229; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 'Segoe UI', 'Malgun Gothic', sans-serif; background: #0f1720; color: #eef6ff; }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center;
    padding: 12px 20px; background: #0f1720ee; border-bottom: 1px solid #29323c;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  .grp { display: flex; gap: 6px; align-items: center; }
  .grp > span { color: #acb7c5; margin-right: 4px; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer; padding: 0; }
  .sw[aria-pressed='true'] { outline: 2px solid #eef6ff; outline-offset: 2px; }
  button.t { background: #29323c; color: #eef6ff; border: 1px solid #454e59; border-radius: 8px; padding: 4px 12px; cursor: pointer; font: inherit; }
  button.t[aria-pressed='true'] { background: #3a75bf; border-color: #3a75bf; }
  main { padding: 20px; }
  h2 { font-size: 15px; margin: 18px 0 8px; color: #c2cddb; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }
  .card { position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; cursor: zoom-in; }
  .card .cap { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #fff; background: #0008; padding: 1px 8px; border-radius: 8px; z-index: 3; }

  /* 배경 한 장 = 캔버스 + 잡음 + 새 탭 모양 */
  .scene { position: absolute; inset: 0; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene .grain { position: absolute; inset: 0; mix-blend-mode: overlay; }
  .ui { position: absolute; inset: 0; }
  .ui .search { position: absolute; left: 50%; transform: translateX(-50%); top: 12%; width: 47%; height: 5.6%; border-radius: 999px; }
  .ui .grid { position: absolute; left: 50%; transform: translateX(-50%); top: 23%; width: 64%; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); row-gap: 3%; }
  .ui .tile { display: flex; flex-direction: column; align-items: center; gap: 6%; }
  .ui .ic { width: 58%; aspect-ratio: 1; border-radius: 28%; display: grid; place-items: center; }
  .ui .ic svg { width: 54%; height: 54%; }
  .ui .tile { min-width: 0; }
  .ui .lb { font-size: var(--lb, 7px); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  /* 카드에서는 흐림 효과(backdrop-filter)를 빼서 가볍게 하고, 실제 크기 보기에서만 쓴다 */
  .scene[data-mode='dark'] .glass { background: rgba(25, 29, 35, .7); border: 1px solid rgba(25, 29, 35, .35); }
  .scene[data-mode='light'] .glass { background: rgba(244, 247, 251, .72); border: 1px solid rgba(244, 247, 251, .35); }
  #full .glass { backdrop-filter: blur(18px) saturate(1.2); }
  .scene[data-mode='dark'] .lb { color: var(--text-dark); text-shadow: 0 1px 2px rgba(0, 0, 0, .45); }
  .scene[data-mode='light'] .lb { color: var(--text-light); }

  #full { position: fixed; inset: 0; z-index: 100; display: none; cursor: zoom-out; }
  #full.open { display: block; }
  #full .cap { position: absolute; left: 16px; bottom: 12px; z-index: 3; color: #fff; background: #0009; padding: 2px 10px; border-radius: 8px; font-size: 13px; }
  #full .ui { --lb: 12.5px; }
  #full .ui .search { width: 680px; height: 50px; top: 12vh; }
  #full .ui .grid { width: min(1040px, 92vw); grid-template-columns: repeat(auto-fill, 96px); justify-content: center; row-gap: 18px; top: calc(12vh + 94px); }
  #full .ui .ic { width: 56px; border-radius: 16px; }
  #full .ui .ic svg { width: 28px; height: 28px; }
</style>
</head>
<body>
<header>
  <h1>배경 고르기</h1>
  <div class="grp" id="accents"><span>강조색</span></div>
  <div class="grp" id="modes"><span>판</span>
    <button class="t" data-v="dark">어둡게</button><button class="t" data-v="light">밝게</button></div>
  <div class="grp"><button class="t" id="shuffle">모두 새 구도로</button></div>
  <div class="grp"><span>카드를 누르면 실제 크기로 봅니다 · Esc로 닫기</span></div>
</header>
<main id="rows"></main>
<div id="full"></div>

<script type="module">
  import { buildScene, AuroraGL, renderCPU, COMPOSITIONS, COMPOSITION_NAMES, grainCss } from '/dist/js/aurora.js';
  const gl = AuroraGL.create(); // 한 번만 만들어 모든 카드를 GPU로 그린다
  import { ACCENT_PRESETS } from '/dist/js/gradient.js';

  const ITEMS = [
    ['메일', '#4c88d3'], ['영상', '#e176a1'], ['포털', '#3a75bf'], ['도우미', '#9b7be6'], ['드라이브', '#3bb48f'],
    ['일정', '#5b93d5'], ['저장소', '#78899f'], ['노트', '#c9934b'], ['디자인', '#df5e97'], ['위키', '#47a7b5'],
    ['장터', '#d97a54'], ['스트리밍', '#c75b7a'], ['질문방', '#d49b38'], ['블로그', '#4aa88c'], ['지도', '#59a66a'],
    ['문서', '#4c88d3'], ['포럼', '#d06b5c'], ['참고서', '#6983c9'], ['번역', '#3ea69b'], ['가계부', '#4b79c4'],
  ];
  const SEEDS_PER = 3;

  const state = { accent: ACCENT_PRESETS[0][2], mode: matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark', seeds: newSeeds() };

  function newSeeds() {
    return COMPOSITIONS.map(() => Array.from({ length: SEEDS_PER }, () => (Math.random() * 2 ** 32) >>> 0));
  }

  function uiHtml() {
    const tiles = ITEMS.map(([label, hex]) => (
      `<div class="tile"><div class="ic glass"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="${hex}"/><circle cx="12" cy="12" r="4.2" fill="#f4f7fb"/></svg></div><span class="lb">${label}</span></div>`
    )).join('');
    return `<div class="ui"><div class="search glass"></div><div class="grid">${tiles}</div></div>`;
  }

  function scene(seed, composition, aspect, full = false) {
    const el = document.createElement('div');
    el.className = 'scene';
    el.dataset.mode = state.mode;
    const sc = buildScene({ accent: state.accent, mode: state.mode, seed, composition, aspect });
    const canvas = document.createElement('canvas');
    const w = full ? Math.round(innerWidth / 2) : 480;
    const h = Math.round(w / aspect);
    canvas.width = w;
    canvas.height = h;
    if (gl) {
      gl.draw(sc, 0, w, h);
      canvas.getContext('2d').drawImage(gl.canvas, 0, 0);
    } else {
      canvas.getContext('2d').drawImage(renderCPU(sc, { width: 320 }), 0, 0, w, h);
    }
    const grain = document.createElement('div');
    grain.className = 'grain';
    grain.style.backgroundImage = grainCss(state.mode);
    el.append(canvas, grain);
    el.insertAdjacentHTML('beforeend', uiHtml());
    return el;
  }

  function render() {
    const rows = document.getElementById('rows');
    rows.replaceChildren();
    COMPOSITIONS.forEach((comp, ci) => {
      const h = document.createElement('h2');
      h.textContent = COMPOSITION_NAMES[comp];
      const row = document.createElement('div');
      row.className = 'row';
      state.seeds[ci].forEach((seed, si) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.append(scene(seed, comp, 16 / 10));
        card.insertAdjacentHTML('beforeend', `<span class="cap">${COMPOSITION_NAMES[comp]} ${si + 1}</span>`);
        card.addEventListener('click', () => openFull(seed, comp, `${COMPOSITION_NAMES[comp]} ${si + 1}`));
        row.append(card);
      });
      rows.append(h, row);
    });
    document.querySelectorAll('#accents .sw').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state.accent)));
    document.querySelectorAll('#modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state.mode)));
  }

  function openFull(seed, comp, label) {
    const full = document.getElementById('full');
    full.replaceChildren(scene(seed, comp, innerWidth / innerHeight, true));
    full.insertAdjacentHTML('beforeend', `<span class="cap">${label} · 실제 크기</span>`);
    full.classList.add('open');
  }
  document.getElementById('full').addEventListener('click', (e) => e.currentTarget.classList.remove('open'));
  addEventListener('keydown', (e) => e.key === 'Escape' && document.getElementById('full').classList.remove('open'));

  const acc = document.getElementById('accents');
  for (const [, name, hex] of ACCENT_PRESETS) {
    const b = document.createElement('button');
    b.className = 'sw';
    b.title = name;
    b.dataset.v = hex;
    b.style.background = hex;
    b.addEventListener('click', () => { state.accent = hex; render(); });
    acc.append(b);
  }
  const pick = document.createElement('input');
  pick.type = 'color';
  pick.title = '직접 고르기';
  pick.addEventListener('change', () => { state.accent = pick.value; render(); });
  acc.append(pick);
  document.querySelectorAll('#modes button').forEach((b) => b.addEventListener('click', () => { state.mode = b.dataset.v; render(); }));
  document.getElementById('shuffle').addEventListener('click', () => { state.seeds = newSeeds(); render(); });

  // 주소 뒤 ?accent=rrggbb&mode=dark|light&seed=n 으로 처음 상태 고정 (스크린샷 확인용)
  const q = new URLSearchParams(location.search);
  if (q.get('accent')) state.accent = '#' + q.get('accent');
  if (q.get('mode')) state.mode = q.get('mode');
  if (q.get('seed')) { let s = +q.get('seed'); state.seeds = COMPOSITIONS.map(() => Array.from({ length: SEEDS_PER }, () => (s = (s * 1103515245 + 12345) >>> 0))); }
  render();
  document.title = 'ready';
</script>
</body>
</html>
